<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula IPTV - Static</title>
    <meta name="description" content="Simple IPTV player for GitHub Pages" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <h1>Nebula IPTV</h1>
        </div>

        <div class="nav-controls" role="group" aria-label="Channel filters">
          <select id="categoryDropdown" class="form-select form-select-sm" aria-label="Filter channels by category">
            <option value="all">All categories</option>
          </select>
          <input id="searchInput" type="search" class="form-control form-control-sm nav-search" placeholder="Search channels" aria-label="Search channels" />
        </div>

        <div class="topbar-actions">
          <button id="settingsBtn" type="button" class="btn btn-outline-light btn-sm px-3">Playlist settings</button>
          <button id="reloadBtn" type="button" class="btn btn-primary btn-sm px-3">Reload</button>
        </div>
      </header>

      <main class="content-grid">
        <section class="panel-card player-panel">
          <div id="playerShell" class="player-frame">
            <div class="player-surface">
              <video id="player" controls autoplay preload="metadata"></video>
            </div>
          </div>

          <div class="selection-box">
            <p class="footer-label">Current selection</p>
            <strong id="currentChannel" class="footer-title">Select a channel</strong>
            <div id="currentChannelDetail" class="selection-detail">Open a channel to start watching.</div>
          </div>
        </section>

        <aside class="panel-card channel-panel">
          <div class="channel-panel-head">
            <div class="channel-title-row">
              <h2>Channels</h2>
              <div id="channelMeta" class="channel-meta">Loading channels...</div>
            </div>
          </div>

          <div class="channel-list-wrap">
            <div id="channelList" class="list-group" aria-live="polite"></div>
          </div>
        </aside>
      </main>
    </div>

    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalTitle">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content settings-content">
          <div class="modal-header settings-modal-border">
            <h5 id="settingsModalTitle" class="modal-title">Playlist source</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" title="Close"></button>
          </div>
          <div class="modal-body">
            <label class="form-label" for="playlistUrlInput">Playlist URL</label>
            <input id="playlistUrlInput" class="form-control playlist-input" placeholder="https://example.com/playlist.json" />
            <div class="form-text settings-help">You can use an M3U/M3U8 URL or a JSON playlist feed.</div>
          </div>
          <div class="modal-footer settings-modal-border">
            <button id="resetPlaylistBtn" type="button" class="btn btn-outline-light btn-sm">Reset</button>
            <button id="savePlaylistBtn" type="button" class="btn btn-primary btn-sm">Save and load</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
    <script src="app.js"></script>
  </body>
</html>
