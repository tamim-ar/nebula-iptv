<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nebula IPTV - Fast & Lightweight Live TV</title>
    <meta name="description" content="Fast, lightweight, modern browser IPTV player with instant auto play and zero loading delay" />
    <meta name="theme-color" content="#0a0d14" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- App Header -->
    <header class="topbar">
      <div class="topbar-brand">
        <a class="brand-link" href="./" aria-label="Nebula IPTV Home">
          <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" focusable="false">
              <path d="M6 5.5c0-2.2 2.4-3.5 4.3-2.3l16.2 10.5c1.8 1.1 1.8 3.7 0 4.8L10.3 29C8.4 30.2 6 28.9 6 26.7V5.5Z" fill="currentColor" />
              <path d="M14.1 11.1 21.2 16l-7.1 4.9v-9.8Z" fill="#ffffff" />
            </svg>
          </span>
          <span class="brand-title">Nebula<span>IPTV</span></span>
        </a>
      </div>

      <div class="topbar-center">
        <div id="liveBadge" class="live-status-pill" title="Live Stream Active">
          <span class="live-dot" aria-hidden="true"></span>
          <span class="live-text">LIVE</span>
          <span id="topbarChannel" class="topbar-channel-title"></span>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="reloadBtn" type="button" class="btn-icon" aria-label="Reload playlist" title="Reload Playlist">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 6v5h-5" />
            <path d="M19 11a7 7 0 1 0-2.1 5" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main App Container -->
    <main class="app-shell">
      <!-- Player Section -->
      <section class="player-section" aria-label="IPTV Player">
        <div id="playerShell" class="player-container">
          <video id="player" playsinline preload="metadata"></video>

          <!-- Center Play Button (Shown before first play or when paused) -->
          <button id="centerPlayBtn" type="button" class="center-play-button" aria-label="Play stream" title="Click to play">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M8 5v14l11-7-11-7Z" fill="currentColor" />
            </svg>
          </button>

          <!-- Top-right Unmute banner (if browser blocked unmuted autoplay) -->
          <button id="unmutePrompt" type="button" class="unmute-badge" aria-label="Unmute stream">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 9v6h4l5 4V5L8 9H4Z" />
              <path d="m18 9-5 5" />
              <path d="m13 9 5 5" />
            </svg>
            <span>Tap to unmute</span>
          </button>

          <!-- Buffering Spinner -->
          <div id="playerSpinner" class="player-spinner" aria-hidden="true">
            <div class="spinner-ring"></div>
          </div>

          <!-- Stream Offline / Error Notice -->
          <div id="playerError" class="player-error-card" hidden>
            <div class="error-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
            </div>
            <p id="playerErrorText" class="error-msg">Stream is currently offline</p>
            <button id="playerRetryBtn" type="button" class="btn-retry">Retry Channel</button>
          </div>

          <!-- Channel Info Overlay (Fades out automatically) -->
          <div id="playerCaption" class="player-caption">
            <span id="currentChannelGroup" class="caption-category">Live TV</span>
            <h1 id="currentChannel" class="caption-title">Select a channel</h1>
          </div>

          <!-- Player Controls Bar -->
          <div id="playerControls" class="player-controls">
            <!-- Progress scrubber (for VOD/recorded feeds) -->
            <div id="timelineContainer" class="timeline-bar" hidden>
              <div id="progressFill" class="timeline-fill"></div>
            </div>

            <div class="controls-row">
              <div class="controls-left">
                <button id="playToggleBtn" type="button" class="ctrl-btn play-ctrl" aria-label="Pause" title="Play / Pause (Space)">
                  <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M8 5v14l11-7-11-7Z" fill="currentColor" />
                  </svg>
                  <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z" fill="currentColor" />
                  </svg>
                </button>

                <button id="muteToggleBtn" type="button" class="ctrl-btn mute-ctrl" aria-label="Mute" title="Mute / Unmute (M)">
                  <svg class="icon-volume" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M4 9v6h4l5 4V5L8 9H4Z" />
                    <path d="M16 9.5a4 4 0 0 1 0 5" />
                    <path d="M18.5 7a7 7 0 0 1 0 10" />
                  </svg>
                  <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M4 9v6h4l5 4V5L8 9H4Z" />
                    <path d="m18 9-5 5" />
                    <path d="m13 9 5 5" />
                  </svg>
                </button>

                <div id="timeDisplay" class="live-indicator-tag">LIVE</div>
              </div>

              <div class="controls-right">
                <button id="pipBtn" type="button" class="ctrl-btn" aria-label="Picture in Picture" title="Picture in Picture">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                    <rect x="12" y="11" width="8" height="7" rx="1" fill="currentColor" />
                  </svg>
                </button>

                <button id="fullscreenBtn" type="button" class="ctrl-btn" aria-label="Toggle Fullscreen" title="Fullscreen (F)">
                  <svg class="icon-fs-enter" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M8 3H3v5" />
                    <path d="M16 3h5v5" />
                    <path d="M8 21H3v-5" />
                    <path d="M16 21h5v-5" />
                  </svg>
                  <svg class="icon-fs-exit" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M4 8h5V3" />
                    <path d="M20 8h-5V3" />
                    <path d="M4 16h5v5" />
                    <path d="M20 16h-5v5" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Channels Sidebar Section -->
      <aside class="sidebar-section" aria-label="Channel Browser">
        <!-- Search Field -->
        <div class="sidebar-search-area">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input id="searchInput" type="search" placeholder="Search channels..." autocomplete="off" spellcheck="false" />
            <button id="clearSearchBtn" type="button" class="btn-clear-search" aria-label="Clear search" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Filter Row: Category Dropdown & Channel Counter -->
        <div class="sidebar-filter-area">
          <div id="categoryPicker" class="category-dropdown-container">
            <button id="categoryToggleBtn" type="button" class="category-toggle-btn" aria-haspopup="listbox" aria-expanded="false">
              <svg class="cat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="2" y="7" width="20" height="15" rx="2" />
                <polyline points="17 2 12 7 7 2" />
              </svg>
              <span id="selectedCategoryLabel" class="cat-label-text">All channels</span>
              <svg class="cat-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div id="categoryMenu" class="category-menu-panel" role="listbox" aria-label="Categories"></div>
          </div>

          <div id="channelMeta" class="channel-count-badge">Loading...</div>
        </div>

        <!-- Scrollable Channel List -->
        <div class="channel-list-container">
          <div id="channelList" class="channel-list-grid" role="list" aria-live="polite"></div>
        </div>

        <!-- Footer / Credits -->
        <footer class="sidebar-footer">
          <span>TV streams powered by <a href="https://github.com/bugsfreeweb/LiveTVCollector" target="_blank" rel="noopener noreferrer" class="credit-link">bugsfreeweb/LiveTVCollector</a></span>
        </footer>
      </aside>
    </main>

    <!-- HLS.js for instant, lightweight stream handling -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
